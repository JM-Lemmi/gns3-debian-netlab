name: Release
on:
  push:

jobs:
  modify-img-networkd:
    runs-on: ubuntu-latest
    container:
      image: debian
    env:
      PKG: "frr frr-doc linux-headers-amd64 jool-dkms jool-tools nmap netcat-traditional telnet apache2 ca-certificates net-tools nftables iptables ebtables bind9 nginx dnsmasq ifupdown bind9-dnsutils isc-dhcp-client"
    steps:
      - uses: actions/checkout@v4
      - run: apt update && apt install -y libguestfs-tools wget
      - run: wget --quiet https://cloud.debian.org/images/cloud/trixie/latest/debian-13-nocloud-amd64.qcow2

      # installing some basic tools
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --run-command 'apt update && apt install -y procps'
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --run-command 'apt update && apt install -y nano neovim wget curl'
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --hostname debian
      
      # offline apt
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --run-command 'apt update && apt install --download-only $PKG'

      - run: mv debian-13-nocloud-amd64.qcow2 debian13-netlab-networkd.qcow2
      - uses: actions/upload-artifact@v4
        with:
          name: debian13-netlab-networkd.qcow2
          path: debian13-netlab-networkd.qcow2
          if-no-files-found: error
          compression-level: 0
  
  generate-gns3a:
    needs: [modify-img-networkd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # systemd-networkd image
      - name: Download debian13-netlab-networkd.qcow2
        uses: actions/download-artifact@v4
        with:
          name: debian13-netlab-networkd.qcow2
      - name: replace md5sum of debian-12-nocloud-amd64.qcow2
        run: sed -i "s/placeholderfornetworkdmd5/$(md5sum debian13-netlab-networkd.qcow2 | cut -d' ' -f1)/g" debian-netlab.gns3a
      - run: sed -i "s/placeholderfornetworkdsize/$(wc -c debian13-netlab-networkd.qcow2 | cut -d' ' -f1)/g" debian-netlab.gns3a

      - uses: actions/upload-artifact@v4
        with:
          name: debian-netlab.gns3a
          path: debian-netlab.gns3a
          if-no-files-found: error
          compression-level: 0
