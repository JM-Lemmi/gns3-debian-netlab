name: Release
on:
  push:

jobs:
  generate-apt-tar:
    runs-on: ubuntu-latest
    container:
      image: debian
    env:
      PKG: "frr frr-doc linux-headers-6.1.0-26-amd64 jool-dkms jool-tools nmap netcat-traditional telnet apache2 ca-certificates net-tools nftables iptables ebtables bind9 nginx dnsmasq ifupdown bind9-dnsutils isc-dhcp-client neovim"
    steps:
      - run: apt update && apt install -y apt-rdepends dpkg-dev
      - run: mkdir netpkgs
      - run: cd netpkgs && apt download $(apt-rdepends $PKG|grep -v "^ "|grep --invert-match -e debconf-2.0 -e libblas.so.3 -e cron-daemon -e libaprutil1-dbd-freetds -e "^host$")
      - run: cd .. && dpkg-scanpackages netpkgs /dev/null | gzip -9c > netpkgs/Packages.gz
      - run: tar cvf debian-netpkgs.tar netpkgs/

      - uses: actions/upload-artifact@v4
        with:
          name: debian-netpkgs.tar
          path: debian-netpkgs.tar
          if-no-files-found: error
          compression-level: 0
    
  modify-img-networkd:
    runs-on: ubuntu-latest
    container:
      image: debian
    steps:
      - uses: actions/checkout@v4
      - run: apt update && apt install -y libguestfs-tools
      - run: wget --quiet https://cloud.debian.org/images/cloud/trixie/latest/debian-13-nocloud-amd64.qcow2

      # installing some basic tools
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --run-command 'apt update && apt install -y procps'
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --run-command 'apt update && apt install -y nano neovim wget curl'
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --hostname debian
      
      # offline apt
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --run-command 'mkdir -p /var/cache/netpkgs && mv /etc/apt/sources.list.d/debian.sources /etc/apt/sources.list.d/debian.sources.bak && echo "deb [trusted=yes] file:/var/cache/netpkgs ./" > /etc/apt/sources.list.d/netpkgs.list && rm -rf /var/lib/apt/lists/*'
      - name: Download debian-netpkgs.tar
        uses: actions/download-artifact@v4
        with:
          name: debian-netpkgs.tar
      - run: virt-customize -a debian-13-nocloud-amd64.qcow2 --tar-in debian-netpkgs.tar:/var/cache/netpkgs/

      - run: mv debian-13-nocloud-amd64.qcow2 debian13-netlab-networkd.qcow2
      - uses: actions/upload-artifact@v4
        with:
          name: debian13-netlab-networkd.qcow2
          path: debian13-netlab-networkd.qcow2
          if-no-files-found: error
          compression-level: 0
  
  generate-gns3a:
    needs: [generate-iso, modify-img-networkd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # systemd-networkd image
      - name: Download debian13-netlab-networkd.qcow2
        uses: actions/download-artifact@v4
        with:
          name: debian13-netlab-networkd.qcow2
      - name: replace md5sum of debian-12-nocloud-amd64.qcow2
        run: sed -i "s/placeholderfornetworkdmd5/$(md5sum debian13-netlab-networkd.qcow2 | cut -d' ' -f1)/g" debian-jle.gns3a
      - run: sed -i "s/placeholderfornetworkdsize/$(wc -c debian13-netlab-networkd.qcow2 | cut -d' ' -f1)/g" debian-jle.gns3a

      - uses: actions/upload-artifact@v4
        with:
          name: debian-jle.gns3a
          path: debian-jle.gns3a
          if-no-files-found: error
          compression-level: 0
